<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cubifai Solutions — Multi-Tenant Portal Sign In</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

  <!-- BACKGROUND DECORATIVE ELEMENTS -->
  <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/30 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-violet-600/30 rounded-full blur-3xl pointer-events-none"></div>

  <div class="w-full max-w-md space-y-6 relative z-10">
    
    <!-- BRANDING HEADER -->
    <div class="text-center space-y-2">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-indigo-500 to-violet-600 text-white shadow-xl shadow-indigo-500/20 mb-2">
        <i class="fa-solid fa-tooth text-2xl"></i>
      </div>
      <h1 class="text-2xl font-extrabold text-white tracking-tight">Cubifai <span class="text-indigo-400">Solutions</span></h1>
      <p id="portal-subtitle" class="text-xs text-slate-400 font-medium">Smart Practice CRM Client Sign In</p>
    </div>

    <!-- CARD CONTAINER -->
    <div class="glass-card border border-slate-700/50 rounded-2xl p-6 shadow-2xl space-y-5 text-slate-800">
      
      <!-- FORM 1: CLIENT USER PORTAL LOGIN -->
      <form id="form-user-login" onsubmit="handleUserLogin(event)" class="space-y-4">
        <div>
          <label for="user-email" class="block text-xs font-semibold text-slate-700 mb-1">Hostinger User Email</label>
          <div class="relative">
            <i class="fa-solid fa-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            <input type="email" id="user-email" required placeholder="user@practice.com" class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-9 pr-4 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-indigo-600 focus:bg-white transition-all">
          </div>
        </div>

        <div>
          <label for="user-password" class="block text-xs font-semibold text-slate-700 mb-1">Account Password</label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            <input type="password" id="user-password" required placeholder="••••••••" class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-9 pr-4 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-indigo-600 focus:bg-white transition-all">
          </div>
        </div>

        <div id="user-alert" class="hidden p-3 rounded-xl text-xs font-medium border"></div>

        <button type="submit" id="btn-user-submit" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs shadow-lg shadow-indigo-200 transition-all flex items-center justify-center space-x-2">
          <i class="fa-solid fa-right-to-bracket"></i>
          <span>Sign In to Client Dashboard</span>
        </button>
      </form>

      <!-- FORM 2: SYSTEM ADMIN PORTAL LOGIN -->
      <form id="form-admin-login" onsubmit="handleAdminLogin(event)" class="space-y-4 hidden">
        <div class="p-3 rounded-xl bg-amber-50 border border-amber-200 text-amber-800 text-[11px] flex items-center space-x-2">
          <i class="fa-solid fa-shield-halved text-amber-600 text-sm"></i>
          <span>Restricted Admin Portal. Authorizes access to system client directory & provisioning.</span>
        </div>

        <div>
          <label for="admin-username" class="block text-xs font-semibold text-slate-700 mb-1">Admin Username</label>
          <div class="relative">
            <i class="fa-solid fa-user-gear absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            <input type="text" id="admin-username" required placeholder="e.g. admin" class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-9 pr-4 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-indigo-600 focus:bg-white transition-all">
          </div>
        </div>

        <div>
          <label for="admin-password" class="block text-xs font-semibold text-slate-700 mb-1">Admin Master Password</label>
          <div class="relative">
            <i class="fa-solid fa-key absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            <input type="password" id="admin-password" required placeholder="••••••••" class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-9 pr-4 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-indigo-600 focus:bg-white transition-all">
          </div>
        </div>

        <div id="admin-alert" class="hidden p-3 rounded-xl text-xs font-medium border"></div>

        <button type="submit" id="btn-admin-submit" class="w-full py-3 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs shadow-lg shadow-slate-900/20 transition-all flex items-center justify-center space-x-2">
          <i class="fa-solid fa-lock"></i>
          <span>Authenticate Admin CRM</span>
        </button>
      </form>

    </div>

    <!-- FOOTER -->
    <div class="text-center text-xs text-slate-500 font-medium">
      <span>Protected by Hetzner VPS Gateway Architecture</span>
    </div>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const path = window.location.pathname.toLowerCase();
      const isAdminMode = path.includes('/kami') || urlParams.get('mode') === 'admin' || urlParams.get('mode') === 'kami';

      const userForm = document.getElementById('form-user-login');
      const adminForm = document.getElementById('form-admin-login');
      const subtitleEl = document.getElementById('portal-subtitle');

      if (isAdminMode) {
        userForm.classList.add('hidden');
        adminForm.classList.remove('hidden');
        if (subtitleEl) subtitleEl.textContent = 'System Admin & Tenant Provisioning Portal';
        document.title = 'Cubifai Solutions — System Admin Sign In';
      } else {
        adminForm.classList.add('hidden');
        userForm.classList.remove('hidden');
        if (subtitleEl) subtitleEl.textContent = 'Smart Practice CRM Client Sign In';
        document.title = 'Cubifai Solutions — Client Sign In';
      }
    });

    function switchLoginTab(tab) {
      activeTab = tab;
      const userBtn = document.getElementById('tab-btn-user');
      const adminBtn = document.getElementById('tab-btn-admin');
      const userForm = document.getElementById('form-user-login');
      const adminForm = document.getElementById('form-admin-login');

      if (tab === 'admin') {
        userBtn.className = "py-2 rounded-lg text-xs font-bold transition-all text-slate-600 hover:text-slate-900 flex items-center justify-center space-x-1.5";
        adminBtn.className = "py-2 rounded-lg text-xs font-bold transition-all bg-white text-indigo-600 shadow-xs flex items-center justify-center space-x-1.5";
        userForm.classList.add('hidden');
        adminForm.classList.remove('hidden');
      } else {
        adminBtn.className = "py-2 rounded-lg text-xs font-bold transition-all text-slate-600 hover:text-slate-900 flex items-center justify-center space-x-1.5";
        userBtn.className = "py-2 rounded-lg text-xs font-bold transition-all bg-white text-indigo-600 shadow-xs flex items-center justify-center space-x-1.5";
        adminForm.classList.add('hidden');
        userForm.classList.remove('hidden');
      }
    }

    async function handleUserLogin(e) {
      e.preventDefault();
      const email = document.getElementById('user-email').value;
      const password = document.getElementById('user-password').value;
      const alertEl = document.getElementById('user-alert');
      const btn = document.getElementById('btn-user-submit');

      alertEl.className = "hidden p-3 rounded-xl text-xs font-medium border";
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> <span>Authenticating...</span>`;

      try {
        const res = await fetch('/api/user/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          alertEl.className = "p-3 rounded-xl text-xs font-medium bg-emerald-50 border-emerald-200 text-emerald-800";
          alertEl.textContent = "Sign in successful! Loading client portal...";
          alertEl.classList.remove('hidden');
          setTimeout(() => {
            window.location.replace('/');
          }, 400);
        } else {
          alertEl.className = "p-3 rounded-xl text-xs font-medium bg-rose-50 border-rose-200 text-rose-800";
          alertEl.textContent = data.detail || "Invalid login credentials";
          alertEl.classList.remove('hidden');
        }
      } catch (err) {
        alertEl.className = "p-3 rounded-xl text-xs font-medium bg-rose-50 border-rose-200 text-rose-800";
        alertEl.textContent = "Network error during authentication";
        alertEl.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-right-to-bracket"></i> <span>Sign In to Client Dashboard</span>`;
      }
    }

    async function handleAdminLogin(e) {
      e.preventDefault();
      const username = document.getElementById('admin-username').value;
      const password = document.getElementById('admin-password').value;
      const alertEl = document.getElementById('admin-alert');
      const btn = document.getElementById('btn-admin-submit');

      alertEl.className = "hidden p-3 rounded-xl text-xs font-medium border";
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> <span>Authenticating Admin...</span>`;

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          alertEl.className = "p-3 rounded-xl text-xs font-medium bg-emerald-50 border-emerald-200 text-emerald-800";
          alertEl.textContent = "Admin authenticated! Redirecting to Admin CRM...";
          alertEl.classList.remove('hidden');
          setTimeout(() => {
            window.location.replace('/admin');
          }, 400);
        } else {
          alertEl.className = "p-3 rounded-xl text-xs font-medium bg-rose-50 border-rose-200 text-rose-800";
          alertEl.textContent = data.detail || "Invalid admin credentials";
          alertEl.classList.remove('hidden');
        }
      } catch (err) {
        alertEl.className = "p-3 rounded-xl text-xs font-medium bg-rose-50 border-rose-200 text-rose-800";
        alertEl.textContent = "Network error during admin authentication";
        alertEl.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-lock"></i> <span>Authenticate Admin CRM</span>`;
      }
    }
  </script>
</body>
</html>
